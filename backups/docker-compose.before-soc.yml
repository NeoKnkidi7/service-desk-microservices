services:

  postgres-user:
    image: postgres:16
    container_name: postgres-user
    environment:
      POSTGRES_DB: service_desk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - user-data:/var/lib/postgresql/data
    networks:
      - service-desk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_desk"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-ticket:
    image: postgres:16
    container_name: postgres-ticket
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ticket-data:/var/lib/postgresql/data
    networks:
      - service-desk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-asset:
    image: postgres:16
    container_name: postgres-asset
    environment:
      POSTGRES_DB: asset_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - asset-data:/var/lib/postgresql/data
    networks:
      - service-desk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asset_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    networks:
      - service-desk-net
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    networks:
      - service-desk-net
    depends_on:
      postgres-user:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user:5432/service_desk
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./logs:/app/logs

  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    ports:
      - "8082:8082"
    networks:
      - service-desk-net
    depends_on:
      postgres-ticket:
        condition: service_healthy
      service-registry:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-ticket:5432/ticket_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    volumes:
      - ./logs:/app/logs

  asset-service:
    build: ./asset-service
    container_name: asset-service
    ports:
      - "8083:8083"
    networks:
      - service-desk-net
    depends_on:
      postgres-asset:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
    volumes:
      - ./logs:/app/logs

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - service-desk-net
    depends_on:
      service-registry:
        condition: service_started
      user-service:
        condition: service_started
      ticket-service:
        condition: service_started
      asset-service:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./logs:/app/logs

volumes:
  user-data:
  ticket-data:
  asset-data:

networks:
  service-desk-net:
    driver: bridge